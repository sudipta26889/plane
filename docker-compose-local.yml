# TaskPilot Development Docker Compose — HOT RELOAD
# Remote services: PostgreSQL & Redis at 192.168.11.118, MinIO at 192.168.11.100:7612
# Nginx Proxy Manager is external

services:
  web:
    container_name: taskpilot-web-dev
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile.dev
      args:
        DOCKER_BUILDKIT: 1
    restart: unless-stopped
    networks:
      - dev_env
    ports:
      - "4646:4646"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    env_file:
      - .env
    depends_on:
      - api

  api:
    container_name: taskpilot-api-dev
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
      args:
        DOCKER_BUILDKIT: 1
    restart: unless-stopped
    networks:
      - dev_env
    ports:
      - "4647:4647"
    volumes:
      - ./apps/api:/code
    command: ./bin/docker-entrypoint-api-local.sh
    env_file:
      - .env
    depends_on:
      - taskpilot-mq

  worker:
    container_name: taskpilot-worker-dev
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
      args:
        DOCKER_BUILDKIT: 1
    restart: unless-stopped
    networks:
      - dev_env
    volumes:
      - ./apps/api:/code
    command: ./bin/docker-entrypoint-worker.sh
    env_file:
      - .env
    depends_on:
      - api
      - taskpilot-mq

  beat-worker:
    container_name: taskpilot-beat-worker-dev
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
      args:
        DOCKER_BUILDKIT: 1
    restart: unless-stopped
    networks:
      - dev_env
    volumes:
      - ./apps/api:/code
    command: ./bin/docker-entrypoint-beat.sh
    env_file:
      - .env
    depends_on:
      - api
      - taskpilot-mq

  migrator:
    container_name: taskpilot-migrator-dev
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
      args:
        DOCKER_BUILDKIT: 1
    restart: "no"
    networks:
      - dev_env
    volumes:
      - ./apps/api:/code
    command: ./bin/docker-entrypoint-migrator.sh --settings=taskpilot.settings.local
    env_file:
      - .env
    depends_on:
      - taskpilot-mq

  live:
    container_name: taskpilot-live-dev
    build:
      context: .
      dockerfile: ./apps/live/Dockerfile.dev
      args:
        DOCKER_BUILDKIT: 1
    restart: unless-stopped
    networks:
      - dev_env
    ports:
      - "4648:4648"
    volumes:
      - .:/app
      - node_modules_live:/app/node_modules
    env_file:
      - .env
    environment:
      PORT: 4648

  admin:
    container_name: taskpilot-admin-dev
    build:
      context: .
      dockerfile: ./apps/admin/Dockerfile.dev
      args:
        DOCKER_BUILDKIT: 1
    restart: unless-stopped
    networks:
      - dev_env
    ports:
      - "4649:4649"
    volumes:
      - .:/app
      - node_modules_admin:/app/node_modules
    env_file:
      - .env
    depends_on:
      - api

  space:
    container_name: taskpilot-space-dev
    build:
      context: .
      dockerfile: ./apps/space/Dockerfile.dev
      args:
        DOCKER_BUILDKIT: 1
    restart: unless-stopped
    networks:
      - dev_env
    volumes:
      - .:/app
      - node_modules_space:/app/node_modules
    env_file:
      - .env
    depends_on:
      - api

  # MCP + A2A Server
  # Serves both MCP (POST /mcp-server) and A2A (POST /a2a) protocols
  # Requires: DATABASE_URL, REDIS_URL, DHARAHIL_* env vars
  mcp:
    container_name: taskpilot-mcp-dev
    build:
      context: ./apps/mcp
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - dev_env
    ports:
      - "4650:4650"
    env_file:
      - .env
    depends_on:
      - api

  taskpilot-mq:
    container_name: taskpilot-mq-dev
    image: rabbitmq:3.13.6-management-alpine
    restart: unless-stopped
    networks:
      - dev_env
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}

volumes:
  rabbitmq_data:
  node_modules:
  node_modules_live:
  node_modules_admin:
  node_modules_space:

networks:
  dev_env:
    driver: bridge
