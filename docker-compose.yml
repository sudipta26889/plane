# TaskPilot Production Docker Compose
#
# All code is baked into images (no volume mounts).
# Remote: PostgreSQL & Redis @ nuc.lan, MinIO @ 192.168.10.100
# Local: Only RabbitMQ container
# Routing: NPM handles SSL + subdomain routing externally
#   taskpilot.sudiptadhara.in       → 4646 (web)
#   taskpilot-api.sudiptadhara.in   → 4647 (api)
#   taskpilot-live.sudiptadhara.in  → 4648 (live)
#   Admin on 4649 (internal access)

services:

  # ---------- Frontend ----------

  web:
    container_name: taskpilot-web
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile.web
      args:
        DOCKER_BUILDKIT: 1
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_WEB_BASE_URL: ${VITE_WEB_BASE_URL}
        VITE_ADMIN_BASE_URL: ${VITE_ADMIN_BASE_URL}
        VITE_ADMIN_BASE_PATH: ${VITE_ADMIN_BASE_PATH}
        VITE_SPACE_BASE_URL: ${VITE_SPACE_BASE_URL}
        VITE_SPACE_BASE_PATH: ${VITE_SPACE_BASE_PATH}
        VITE_LIVE_BASE_URL: ${VITE_LIVE_BASE_URL}
        VITE_LIVE_BASE_PATH: ${VITE_LIVE_BASE_PATH}
        VITE_MCP_BASE_URL: ${VITE_MCP_BASE_URL}
    ports:
      - "4646:4646"
    restart: always
    depends_on:
      - api
    env_file:
      - .env

  admin:
    container_name: taskpilot-admin
    build:
      context: .
      dockerfile: ./apps/admin/Dockerfile.admin
      args:
        DOCKER_BUILDKIT: 1
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_ADMIN_BASE_URL: ${VITE_ADMIN_BASE_URL}
        VITE_ADMIN_BASE_PATH: ${VITE_ADMIN_BASE_PATH}
    ports:
      - "4649:4649"
    restart: always
    depends_on:
      - api
    env_file:
      - .env

  space:
    container_name: taskpilot-space
    build:
      context: .
      dockerfile: ./apps/space/Dockerfile.space
      args:
        DOCKER_BUILDKIT: 1
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_SPACE_BASE_URL: ${VITE_SPACE_BASE_URL}
        VITE_SPACE_BASE_PATH: ${VITE_SPACE_BASE_PATH}
    restart: always
    depends_on:
      - api
    env_file:
      - .env

  live:
    container_name: taskpilot-live
    build:
      context: .
      dockerfile: ./apps/live/Dockerfile.live
      args:
        DOCKER_BUILDKIT: 1
    ports:
      - "4648:4648"
    restart: always
    env_file:
      - .env
    environment:
      PORT: 4648

  # ---------- Backend ----------

  api:
    container_name: taskpilot-api
    dns:
      - 192.168.11.1
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    ports:
      - "4647:4647"
    restart: always
    command: ./bin/docker-entrypoint-api.sh
    env_file:
      - .env
    depends_on:
      - taskpilot-mq

  worker:
    container_name: taskpilot-worker
    dns:
      - 192.168.11.1
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    command: ./bin/docker-entrypoint-worker.sh
    env_file:
      - .env
    depends_on:
      - api
      - taskpilot-mq

  beat-worker:
    container_name: taskpilot-beat-worker
    dns:
      - 192.168.11.1
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    command: ./bin/docker-entrypoint-beat.sh
    env_file:
      - .env
    depends_on:
      - api
      - taskpilot-mq

  migrator:
    container_name: taskpilot-migrator
    dns:
      - 192.168.11.1
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: "no"
    command: ./bin/docker-entrypoint-migrator.sh
    env_file:
      - .env
    depends_on:
      - taskpilot-mq

  # ---------- MCP + A2A Server ----------
  # Serves both MCP (POST /mcp-server) and A2A (POST /a2a) protocols
  # Requires: DATABASE_URL, REDIS_URL, DHARAHIL_* env vars

  mcp:
    container_name: taskpilot-mcp
    dns:
      - 192.168.11.1
    build:
      context: ./apps/mcp
      dockerfile: Dockerfile
    ports:
      - "4650:4650"
    env_file:
      - .env
    depends_on:
      - api
    restart: always

  # ---------- Infrastructure (local) ----------

  taskpilot-mq:
    container_name: taskpilot-mq
    image: rabbitmq:3.13.6-management-alpine
    restart: always
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  rabbitmq_data:
